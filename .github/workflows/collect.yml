name: collect

# Each run schedules the next one, five minutes after its own start, so
# collection does not depend on the scheduler. The cron entry only restarts
# the chain if a run ever fails to schedule its successor.
on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      INTERVAL_S: 300
    steps:
      - name: Note start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t .

      - name: Collect
        id: collect
        run: |
          set +e
          python -m collector.run
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit --quiet -m "Add data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Check dashboard age
        id: dashboard
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_INTERVAL_S: 3600
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=assets/dashboard-light.png&per_page=1" \
            --jq '.[0].commit.committer.date // "1970-01-01T00:00:00Z"')
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "Dashboard last updated $last, ${age}s ago."
          echo "due=$([ "$age" -ge "$DASHBOARD_INTERVAL_S" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update dashboard
        if: ${{ !cancelled() && steps.dashboard.outputs.due == 'true' }}
        continue-on-error: true
        env:
          DASHBOARD_FONT: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          pip install -r requirements-dashboard.txt
          python -m unittest tests.test_dashboard
          python -m dashboard.render
          git add assets/dashboard-*.png
          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git commit --quiet -m "Update dashboard $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Schedule next run
        if: ${{ !cancelled() && steps.collect.outputs.code != '3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( RUN_STARTED + INTERVAL_S - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            sleep "$wait"
          fi
          for attempt in 1 2 3; do
            gh workflow run collect.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Fail when every session failed
        if: ${{ steps.collect.outputs.code == '1' }}
        run: exit 1
