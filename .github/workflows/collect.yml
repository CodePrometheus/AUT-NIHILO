name: collect

# Each run schedules the next one, five minutes after its own start, so
# collection does not depend on the scheduler. The cron entry only restarts
# the chain if a run ever fails to schedule its successor.
on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      INTERVAL_S: 300
    steps:
      - name: Note start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -t .

      - name: Collect
        id: collect
        run: |
          set +e
          python -m collector.run
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit --quiet -m "Add data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Schedule next run
        if: ${{ !cancelled() && steps.collect.outputs.code != '3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( RUN_STARTED + INTERVAL_S - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            sleep "$wait"
          fi
          for attempt in 1 2 3; do
            gh workflow run collect.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Fail when every session failed
        if: ${{ steps.collect.outputs.code == '1' }}
        run: exit 1
